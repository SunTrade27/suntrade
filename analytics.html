<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="icon" type="image/svg+xml" href="/images/favicon.svg">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
  body { background: #0b1628; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }

  .analytics-page {
    min-height: 100vh;
    padding: 1.5rem 1rem 4rem;
    background: linear-gradient(180deg,
      #0b1628 0%,
      #132744 15%,
      #1a3a5c 30%,
      #2d6187 45%,
      #4a90b8 55%,
      #7ec8e3 65%,
      #f4a460 78%,
      #ff8c42 88%,
      #ff6b00 95%,
      #ff4500 100%
    );
    position: relative;
  }
  .analytics-page::before {
    content: '';
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(255,200,50,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(255,140,0,0.08) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .analytics-container { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }

  .analytics-header {
    text-align: center; margin-bottom: 2rem;
    animation: fadeSlideDown 0.6s ease;
  }
  .analytics-header h1 {
    font-size: 2.5rem; font-weight: 900;
    background: linear-gradient(135deg, #FF6B00 0%, #FFD700 50%, #fff 100%);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 0.5rem;
  }
  .analytics-header p { color: rgba(255,255,255,0.5); font-size: 0.95rem; }

  @media (max-width: 768px) { .analytics-header h1 { font-size: 1.6rem; } .analytics-header p { font-size: 0.8rem; } }
  @keyframes fadeSlideDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }

  /* ===== Stats Grid ===== */
  .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
  @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }

  .stat-card {
    position: relative; padding: 1.5rem 1.25rem; border-radius: 20px;
    background: rgba(11,22,40,0.45); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 8px 32px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow: hidden; transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    transform-style: preserve-3d; perspective: 600px; cursor: default;
  }
  .stat-card:hover {
    transform: translateY(-6px);
    border-color: rgba(255,107,0,0.25);
    box-shadow: 0 16px 48px rgba(255,107,0,0.12), 0 0 0 1px rgba(255,107,0,0.15), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .stat-card::after {
    content: ''; position: absolute; top: 0; left: 10%; width: 80%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
    transition: opacity 0.4s; opacity: 0;
  }
  .stat-card:hover::after { opacity: 1; }

  .stat-card-icon {
    width: 48px; height: 48px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1rem; font-size: 1.3rem;
    transition: transform 0.3s; position: relative; z-index: 1;
  }
  .stat-card:hover .stat-card-icon { transform: scale(1.1); }

  .sc-products .stat-card-icon { background: rgba(255,107,0,0.15); color: #FF6B00; }
  .sc-orders .stat-card-icon { background: rgba(255,107,0,0.12); color: #FFD700; }
  .sc-pending .stat-card-icon { background: rgba(59,130,246,0.15); color: #3B82F6; }
  .sc-reviews .stat-card-icon { background: rgba(16,185,129,0.15); color: #10B981; }

  .stat-card-value {
    font-size: 2.2rem; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #fff, #e0e0e0);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    margin-bottom: 0.3rem; position: relative; z-index: 1; transition: transform 0.3s;
  }
  .stat-card:hover .stat-card-value { transform: scale(1.05); }
  .stat-card-label {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px;
    color: rgba(255,255,255,0.4); position: relative; z-index: 1;
  }
  @media (max-width: 480px) {
    .stat-card { padding: 1rem 0.75rem; border-radius: 16px; }
    .stat-card-value { font-size: 1.5rem; }
    .stat-card-icon { width: 36px; height: 36px; border-radius: 10px; margin-bottom: 0.6rem; }
  }

  /* ===== Charts ===== */
  .charts-grid { display: block; margin-bottom: 2rem; }

  .chart-card {
    border-radius: 20px;
    background: rgba(11,22,40,0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    padding: 1.5rem; overflow: hidden;
  }
  .chart-card h3 {
    font-size: 0.9rem; font-weight: 700; color: rgba(255,255,255,0.55);
    margin-bottom: 1.25rem; text-transform: uppercase; letter-spacing: 0.5px;
  }

  .bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 180px; padding-top: 1rem; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.4rem; height: 100%; justify-content: flex-end; }
  .bar-fill {
    width: 100%; max-width: 50px; border-radius: 8px 8px 4px 4px;
    transition: height 1s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s;
    min-height: 4px; cursor: pointer;
    background: linear-gradient(180deg, #FF6B00, #FF4500);
  }
  .bar-fill:hover { filter: brightness(1.3); }
  .bar-label { font-size: 0.6rem; color: rgba(255,255,255,0.35); text-align: center; }
  .bar-val { font-size: 0.65rem; font-weight: 700; color: rgba(255,255,255,0.6); }
  @media (max-width: 480px) { .bar-chart { height: 120px; gap: 0.3rem; } .bar-fill { max-width: 40px; } }

  /* ===== Recent Orders ===== */
  .recent-orders {
    border-radius: 20px;
    background: rgba(11,22,40,0.35); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    padding: 1.5rem; margin-bottom: 2rem;
  }
  .recent-orders h3 { font-size: 0.9rem; font-weight: 700; color: rgba(255,255,255,0.55); margin-bottom: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .order-row {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.75rem;
    border-radius: 12px; transition: all 0.25s;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .order-row:last-child { border-bottom: none; }
  .order-row:hover { background: rgba(255,255,255,0.03); }
  .order-amount { font-weight: 800; color: #FFD700; min-width: 70px; font-size: 0.85rem; }
  .order-name { flex: 1; font-size: 0.85rem; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-status {
    padding: 3px 10px; border-radius: 50px; font-size: 0.65rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .os-paid { background: rgba(59,130,246,0.15); color: #3B82F6; }
  .os-shipped { background: rgba(255,107,0,0.15); color: #FF6B00; }
  .os-delivered { background: rgba(16,185,129,0.15); color: #10B981; }
  .os-accepted { background: rgba(255,215,0,0.15); color: #FFD700; }
  .os-packing { background: rgba(251,191,36,0.15); color: #FBBF24; }
  .order-date { font-size: 0.7rem; color: rgba(255,255,255,0.3); min-width: 70px; text-align: right; }
  @media (max-width: 480px) { .order-amount { min-width: 55px; font-size: 0.75rem; } .order-name { font-size: 0.7rem; } .order-date { display: none; } }

  .loading-shimmer {
    background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
    background-size: 200% 100%; animation: shimmer 1.5s ease-in-out infinite; border-radius: 8px;
  }
  @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

  .analytics-footer { text-align: center; margin-top: 1rem; }
</style>
</head><body>

<div class="analytics-page">
  <div class="analytics-container">
    <div class="analytics-header">
      <h1 data-i18n="nav_analytics">Сайттың анализі</h1>
      <p data-i18n="analytics_subtitle">SunTrade статистикасы — нақты уақытта</p>
    </div>

    <div class="stats-grid" id="stats-grid">
      <div class="stat-card sc-products">
        <div class="stat-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/></svg></div>

      </div>
      <div class="stat-card sc-orders">
        <div class="stat-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg></div>
        <div class="stat-card-value" id="s-orders">28</div>
        <div class="stat-card-label" data-i18n="admin_orders">Заказдар</div>
      </div>
      <div class="stat-card sc-pending">
        <div class="stat-card-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2z"/><path d="M12 6v6l4 2"/></svg></div>

        <div class="stat-card-label" data-i18n="analytics_pending">Күтілуде</div>

          <div class="bar-col"><div class="bar-val" id="bar-shipped-val">0</div><div class="bar-fill" id="bar-shipped" style="height:0%;background:linear-gradient(180deg,#FF6B00,#FF4500)"></div><div class="bar-label">Shipped</div></div>
          <div class="bar-col"><div class="bar-val" id="bar-delivered-val">0</div><div class="bar-fill" id="bar-delivered" style="height:0%;background:linear-gradient(180deg,#10B981,#059669)"></div><div class="bar-label">Delivered</div></div>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    setTimeout(async () => {
      if (!sb) return;
      await Promise.all([loadStats(), loadOrderStatuses(), loadRecentOrders()]);
      applyTranslations();
    }, 300);
  });

  async function loadStats() {
    try {
      const [productsRes, reviewsRes, pendingRes] = await Promise.all([
        sb.from('products').select('id', { count: 'exact', head: true }).eq('active', true),
        sb.from('reviews').select('id', { count: 'exact', head: true }).eq('approved', true),
        sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'pending')
      ]);
      setEl('s-products', (productsRes && productsRes.count) || 0);
      setEl('s-reviews', (reviewsRes && reviewsRes.count) || 0);
      setEl('s-pending', (pendingRes && pendingRes.count) || 0);
    } catch(e) {}
  }

  async function loadOrderStatuses() {
    try {
      const statuses = ['paid', 'shipped', 'delivered', 'accepted', 'packing'];
      const results = await Promise.all(statuses.map(s =>
        sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', s)
      ));
      const counts = results.map(r => (r && r.count) || 0);
      const maxVal = Math.max(1, ...counts);
      statuses.forEach((s, i) => {
        setEl('bar-' + s + '-val', counts[i]);
        const bar = document.getElementById('bar-' + s);
        if (bar) bar.style.height = (counts[i] / maxVal * 100) + '%';
      });
    } catch(e) {}
  }

  async function loadRecentOrders() {
    try {
      const { data } = await sb.from('orders').select('id, customer_name, amount, status, created_at')
        .order('created_at', { ascending: false }).limit(10);

      // Fake demo orders (show even when no real orders yet)
      var demoOrders = [
        { customer_name: 'Айжан Нұрланова', amount: 142.50, status: 'delivered', created_at: '2026-08-05T14:30:00' },
        { customer_name: 'Marco Rossi', amount: 89.00, status: 'delivered', created_at: '2026-08-05T11:15:00' },
        { customer_name: 'Ерлан Қайратов', amount: 256.80, status: 'delivered', created_at: '2026-08-05T09:45:00' },
        { customer_name: 'Anna Müller', amount: 67.20, status: 'delivered', created_at: '2026-08-04T16:20:00' },
        { customer_name: 'Динара Әбдірахман', amount: 310.00, status: 'delivered', created_at: '2026-08-04T13:10:00' },
        { customer_name: 'John Smith', amount: 45.90, status: 'delivered', created_at: '2026-08-04T10:00:00' },
        { customer_name: 'Гүлнұр Төлегенова', amount: 178.30, status: 'paid', created_at: '2026-08-03T15:45:00' },
        { customer_name: 'Pierre Dubois', amount: 92.00, status: 'accepted', created_at: '2026-08-03T12:30:00' }
      ];

      var allOrders = [];
      if (data && data.length) {
        allOrders = data.concat(demoOrders.filter(function(d) { return !data.some(function(r) { return r.customer_name === d.customer_name; }); }));
      } else {
        allOrders = demoOrders;
      }
      allOrders.sort(function(a, b) { return new Date(b.created_at) - new Date(a.created_at); });
      allOrders = allOrders.slice(0, 10);

      var sc = {paid:'os-paid', shipped:'os-shipped', delivered:'os-delivered', accepted:'os-accepted', packing:'os-packing', pending:'os-packing'};
      document.getElementById('recent-orders-list').innerHTML = allOrders.map(function(o) {
        var d = new Date(o.created_at);
        return '<div class="order-row">' +
          '<div class="order-amount">€' + parseFloat(o.amount || 0).toFixed(0) + '</div>' +
          '<div class="order-name">' + escapeHtml(o.customer_name || '—') + '</div>' +
          '<div class="order-status ' + (sc[o.status] || 'os-paid') + '">' + (o.status || '—') + '</div>' +
          '<div class="order-date">' + d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}) + ' ' + d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}) + '</div>' +
        '</div>';
      }).join('');
    } catch(e) {}
  }

  function setEl(id, val) { var el = document.getElementById(id); if (el) el.textContent = String(val); }
  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
