<style>
  body { background: #06060f; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
  
  .analytics-page { min-height: 100vh; padding: 2rem 1rem 4rem; }
  
  /* ===== Animated Grid Background ===== */
  .analytics-page::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse at 30% 20%, rgba(255,107,0,0.08) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(168,85,247,0.06) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(59,130,246,0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  
  .analytics-container { max-width: 1280px; margin: 0 auto; position: relative; z-index: 1; }
  
  /* ===== Header ===== */
  .analytics-header {
    text-align: center;
    margin-bottom: 2.5rem;
    animation: fadeSlideDown 0.6s ease;
  }
  .analytics-header h1 {
    font-size: 2.5rem;
    font-weight: 900;
    background: linear-gradient(135deg, #FF6B00 0%, #FFD700 50%, #fff 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.5rem;
  }
  .analytics-header p {
    color: rgba(255,255,255,0.5);
    font-size: 0.95rem;
  }
  @media (max-width: 768px) {
    .analytics-header h1 { font-size: 1.6rem; }
    .analytics-header p { font-size: 0.8rem; }
  }
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* ===== 3D Stats Cards ===== */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1rem;
    margin-bottom: 2rem;
  }
  @media (max-width: 768px) { .stats-grid { grid-template-columns: repeat(2, 1fr); gap: 0.75rem; } }
  @media (max-width: 400px) { .stats-grid { grid-template-columns: 1fr 1fr; gap: 0.5rem; } }

  .stat-card {
    position: relative;
    padding: 1.5rem 1.25rem;
    border-radius: 20px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    overflow: hidden;
    transition: all 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    cursor: default;
    transform-style: preserve-3d;
    perspective: 600px;
  }
  .stat-card:hover {
    transform: translateY(-6px) rotateX(3deg) rotateY(-2deg);
    border-color: rgba(255,107,0,0.3);
    box-shadow: 0 20px 50px rgba(255,107,0,0.1), 0 0 0 1px rgba(255,107,0,0.1);
  }
  .stat-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    opacity: 0;
    transition: opacity 0.4s;
    z-index: 0;
    pointer-events: none;
  }
  .stat-card:hover::before { opacity: 1; }
  .stat-card-1::before { background: linear-gradient(135deg, rgba(255,107,0,0.1), transparent 60%); }
  .stat-card-2::before { background: linear-gradient(135deg, rgba(16,185,129,0.1), transparent 60%); }
  .stat-card-3::before { background: linear-gradient(135deg, rgba(168,85,247,0.1), transparent 60%); }
  .stat-card-4::before { background: linear-gradient(135deg, rgba(59,130,246,0.1), transparent 60%); }
  
  .stat-card-icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 1rem;
    position: relative; z-index: 1;
    font-size: 1.3rem;
    transition: transform 0.3s;
  }
  .stat-card:hover .stat-card-icon { transform: scale(1.1) rotate(-5deg); }
  .stat-card-1 .stat-card-icon { background: rgba(255,107,0,0.15); color: #FF6B00; }
  .stat-card-2 .stat-card-icon { background: rgba(16,185,129,0.15); color: #10B981; }
  .stat-card-3 .stat-card-icon { background: rgba(168,85,247,0.15); color: #A855F7; }
  .stat-card-4 .stat-card-icon { background: rgba(59,130,246,0.15); color: #3B82F6; }
  
  .stat-card-value {
    font-size: 2.2rem; font-weight: 900; line-height: 1;
    background: linear-gradient(135deg, #fff, #e0e0e0);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 0.3rem; position: relative; z-index: 1;
    transition: transform 0.3s;
  }
  .stat-card:hover .stat-card-value { transform: scale(1.05); }
  
  .stat-card-label {
    font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.5px; color: rgba(255,255,255,0.4);
    position: relative; z-index: 1;
  }
  
  /* 3D highlight */
  .stat-card::after {
    content: '';
    position: absolute;
    top: 0; left: 10%; width: 80%; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    z-index: 2;
    transition: opacity 0.4s;
    opacity: 0;
  }
  .stat-card:hover::after { opacity: 1; }

  @media (max-width: 480px) {
    .stat-card { padding: 1rem 0.75rem; border-radius: 16px; }
    .stat-card-value { font-size: 1.5rem; }
    .stat-card-icon { width: 36px; height: 36px; border-radius: 10px; margin-bottom: 0.6rem; }
    .stat-card-icon svg { width: 16px; height: 16px; }
  }

  /* ===== Charts Section ===== */
  .charts-grid {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 1rem;
    margin-bottom: 2rem;
  }
  @media (max-width: 768px) { .charts-grid { grid-template-columns: 1fr; } }

  .chart-card {
    border-radius: 20px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    padding: 1.5rem;
    overflow: hidden;
  }
  .chart-card h3 {
    font-size: 0.9rem;
    font-weight: 700;
    color: rgba(255,255,255,0.6);
    margin-bottom: 1.25rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  /* Bar chart */
  .bar-chart { display: flex; align-items: flex-end; gap: 0.5rem; height: 180px; padding-top: 1rem; }
  .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.5rem; height: 100%; justify-content: flex-end; }
  .bar-fill {
    width: 100%; max-width: 50px;
    border-radius: 8px 8px 4px 4px;
    transition: height 1s cubic-bezier(0.25, 0.46, 0.45, 0.94), filter 0.3s;
    position: relative;
    min-height: 4px;
    background: linear-gradient(180deg, #FF6B00, #FF4500);
    cursor: pointer;
  }
  .bar-fill:hover { filter: brightness(1.3); }
  .bar-label { font-size: 0.6rem; color: rgba(255,255,255,0.4); text-align: center; }
  .bar-val { font-size: 0.65rem; font-weight: 700; color: rgba(255,255,255,0.7); }
  @media (max-width: 480px) { 
    .bar-chart { height: 120px; gap: 0.3rem; }
    .bar-fill { max-width: 40px; }
  }

  /* Countries list */
  .countries-list { display: flex; flex-direction: column; gap: 0.6rem; }
  .country-row {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.6rem 0.8rem;
    border-radius: 12px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.04);
    transition: all 0.3s;
  }
  .country-row:hover { border-color: rgba(255,107,0,0.2); background: rgba(255,107,0,0.05); transform: translateX(4px); }
  .country-flag { font-size: 1.3rem; width: 32px; text-align: center; }
  .country-name { flex: 1; font-size: 0.85rem; color: rgba(255,255,255,0.7); }
  .country-count { font-weight: 700; font-size: 0.9rem; color: #FF6B00; }

  /* ===== Recent Orders ===== */
  .recent-orders {
    border-radius: 20px;
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    padding: 1.5rem;
    margin-bottom: 2rem;
  }
  .recent-orders h3 {
    font-size: 0.9rem; font-weight: 700;
    color: rgba(255,255,255,0.6);
    margin-bottom: 1rem;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .order-row {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 0.65rem 0.8rem; border-radius: 12px;
    transition: all 0.25s;
    border-bottom: 1px solid rgba(255,255,255,0.03);
  }
  .order-row:last-child { border-bottom: none; }
  .order-row:hover { background: rgba(255,255,255,0.03); }
  .order-amount { font-weight: 800; color: #10B981; min-width: 70px; font-size: 0.85rem; }
  .order-name { flex: 1; font-size: 0.85rem; color: rgba(255,255,255,0.8); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .order-status {
    padding: 3px 10px; border-radius: 50px;
    font-size: 0.65rem; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.3px;
  }
  .os-paid { background: rgba(59,130,246,0.15); color: #3B82F6; }
  .os-shipped { background: rgba(168,85,247,0.15); color: #A855F7; }
  .os-delivered { background: rgba(16,185,129,0.15); color: #10B981; }
  .os-accepted { background: rgba(255,107,0,0.15); color: #FF6B00; }
  .os-packing { background: rgba(251,191,36,0.15); color: #FBBF24; }
  .order-date { font-size: 0.7rem; color: rgba(255,255,255,0.3); min-width: 70px; text-align: right; }
  @media (max-width: 480px) {
    .order-amount { min-width: 55px; font-size: 0.75rem; }
    .order-name { font-size: 0.7rem; }
    .order-date { display: none; }
  }

  /* Loading shimmer */
  .loading-shimmer {
    background: linear-gradient(90deg, rgba(255,255,255,0.03) 25%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.03) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s ease-in-out infinite;
    border-radius: 8px;
  }
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* Bottom action */
  .analytics-footer {
    text-align: center; margin-top: 2rem;
  }
  .analytics-footer a {
    display: inline-flex; align-items: center; gap: 0.5rem;
    padding: 0.7rem 1.5rem;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    text-decoration: none;
    font-size: 0.85rem; font-weight: 600;
    transition: all 0.3s;
  }
  .analytics-footer a:hover {
    background: rgba(255,107,0,0.1);
    border-color: rgba(255,107,0,0.3);
    color: #FFD700;
    transform: translateY(-2px);
  }

  /* Toast */
  .analytics-toast {
    position: fixed; bottom: 24px; right: 24px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    color: white; padding: 10px 20px;
    border-radius: 10px; font-size: 0.8rem; font-weight: 600;
    z-index: 99999; backdrop-filter: blur(12px);
    animation: toastIn 0.3s ease;
  }
  @keyframes toastIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
</style>

<script>
  // ===== Load Analytics =====
  document.addEventListener('DOMContentLoaded', async () => {
    setTimeout(async () => {
      if (!sb) return;
      await loadStats();
      await loadOrderStatuses();
      await loadCountries();
      await loadRecentOrders();
    }, 300);
  });

  async function loadStats() {
    try {
      const [productsRes, ordersRes, reviewsRes, pendingRes] = await Promise.all([
        sb.from('products').select('id', { count: 'exact', head: true }).eq('active', true),
        sb.from('orders').select('id', { count: 'exact', head: true }).in('status', ['paid','shipped','delivered','accepted','packing']),
        sb.from('reviews').select('id', { count: 'exact', head: true }).eq('approved', true),
        sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', 'pending')
      ]);

      setEl('s-products', (productsRes && productsRes.count) || 0);
      setEl('s-orders', (ordersRes && ordersRes.count) || 0);
      setEl('s-reviews', (reviewsRes && reviewsRes.count) || 0);
      setEl('s-pending', (pendingRes && pendingRes.count) || 0);
    } catch(e) { console.error('Stats error:', e); }
  }

  async function loadOrderStatuses() {
    try {
      const statuses = ['paid', 'shipped', 'delivered', 'accepted', 'packing'];
      const results = await Promise.all(statuses.map(s => 
        sb.from('orders').select('id', { count: 'exact', head: true }).eq('status', s)
      ));
      
      const counts = results.map(r => (r && r.count) || 0);
      const maxVal = Math.max(1, ...counts);
      const total = counts.reduce((a,b) => a+b, 0);

      statuses.forEach((s, i) => {
        const pct = (counts[i] / maxVal) * 100;
        setEl('bar-' + s + '-val', counts[i]);
        const bar = document.getElementById('bar-' + s);
        if (bar) bar.style.height = pct + '%';
      });
    } catch(e) { console.error('Status error:', e); }
  }

  async function loadCountries() {
    try {
      const { data } = await sb.from('orders').select('shipping_country')
        .in('status', ['paid','shipped','delivered','accepted','packing'])
        .not('shipping_country', 'is', null);
      
      if (!data || !data.length) {
        document.getElementById('countries-list').innerHTML = '<div class="country-row"><span class="country-name" style="color:rgba(255,255,255,0.3)">Әзірше дерек жоқ</span></div>';
        return;
      }

      const counts = {};
      data.forEach(o => {
        const c = (o.shipping_country || '').trim();
        if (c) counts[c] = (counts[c] || 0) + 1;
      });

      const flags = { 'Казахстан': '🇰🇿', 'Kazakhstan': '🇰🇿', 'Россия': '🇷🇺', 'Russia': '🇷🇺', 'USA': '🇺🇸', 'Germany': '🇩🇪', 'France': '🇫🇷', 'UK': '🇬🇧', 'Turkey': '🇹🇷', 'UAE': '🇦🇪', 'China': '🇨🇳', 'Belarus': '🇧🇾', 'Ukraine': '🇺🇦', 'Uzbekistan': '🇺🇿', 'Kyrgyzstan': '🇰🇬' };
      const sorted = Object.entries(counts).sort((a,b) => b[1] - a[1]).slice(0, 8);
      
      document.getElementById('countries-list').innerHTML = sorted.map(([name, count]) => `
        <div class="country-row">
          <div class="country-flag">${flags[name] || '🌍'}</div>
          <div class="country-name">${escapeHtml(name)}</div>
          <div class="country-count">${count}</div>
        </div>
      `).join('');
    } catch(e) { console.error('Countries error:', e); }
  }

  async function loadRecentOrders() {
    try {
      const { data } = await sb.from('orders').select('id, customer_name, amount, status, created_at')
        .order('created_at', { ascending: false }).limit(10);
      
      if (!data || !data.length) {
        document.getElementById('recent-orders-list').innerHTML = '<div class="order-row"><span style="color:rgba(255,255,255,0.3);padding:1rem">Әзірше заказ жоқ</span></div>';
        return;
      }

      const statusClasses = { paid:'os-paid', shipped:'os-shipped', delivered:'os-delivered', accepted:'os-accepted', packing:'os-packing', pending:'os-packing' };
      
      document.getElementById('recent-orders-list').innerHTML = data.map(o => {
        const d = new Date(o.created_at);
        const dateStr = d.toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit' });
        const timeStr = d.toLocaleTimeString('ru-RU', { hour:'2-digit', minute:'2-digit' });
        return `
        <div class="order-row">
          <div class="order-amount">€${parseFloat(o.amount || 0).toFixed(0)}</div>
          <div class="order-name">${escapeHtml(o.customer_name || '—')}</div>
          <div class="order-status ${statusClasses[o.status] || 'os-paid'}">${o.status || '—'}</div>
          <div class="order-date">${dateStr} ${timeStr}</div>
        </div>`;
      }).join('');
    } catch(e) { console.error('Orders error:', e); }
  }

  function setEl(id, val) { var el = document.getElementById(id); if (el) el.textContent = String(val); }
  function escapeHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
